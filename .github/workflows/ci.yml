name: CI Verification Harness

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  verify:
    name: Tagref & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Tagref
        run: |
          mkdir -p "${HOME}/.local/bin"
          PREFIX="${HOME}/.local/bin" curl https://raw.githubusercontent.com/stepchowfun/tagref/main/install.sh -LSfs | sh
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Verify Tagref Cross-References (Gate 6)
        run: ./bin/gargamelle-tagref

      - name: Verify Markdown Links & Anchors (Gate 7)
        run: ./bin/gargamelle-linkcheck

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap sqlite3 z3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 2>/dev/null || true
          if [ -d /etc/apparmor.d ]; then
            printf 'abi <abi/4.0>,\ninclude <tunables/global>\nprofile bwrap /usr/bin/bwrap flags=(unconfined) {\n    userns,\n    include if exists <local/bwrap>\n}\n' | sudo tee /etc/apparmor.d/bwrap >/dev/null || true
            sudo apparmor_parser -r /etc/apparmor.d/bwrap 2>/dev/null || true
          fi

      - name: Configure Git for HTTPS submodules
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Set up Haskell Toolchain
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.14.1'
          cabal-version: '3.18.1.0'

      - name: Install HLint
        run: ghcup install hlint recommended --set || true

      - name: Cache Cabal artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Build All Packages & Dependencies
        run: cabal build all --enable-tests

      - name: Verify Literate Documentation (Gate 5)
        run: ./bin/gargamelle-doccheck

      - name: Verify Hyperlinked Haddock Documentation (Gate 8)
        run: ./bin/gargamelle-haddock --check

      - name: Install mdBook & Plugins
        run: |
          mkdir -p "${HOME}/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.4/mdbook-v0.5.4-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "${HOME}/.local/bin"
          curl -sSL https://github.com/badboy/mdbook-mermaid/releases/download/v0.17.1/mdbook-mermaid-v0.17.1-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "${HOME}/.local/bin"
          chmod +x "${HOME}/.local/bin/mdbook" "${HOME}/.local/bin/mdbook-mermaid"
          echo "${HOME}/.local/bin" >> $GITHUB_PATH

      - name: Verify mdBook Treatise Site (Gate 10)
        run: ./bin/gargamelle-mdbook --check

      - name: Run Full Physical Verification Gates (10 Gates)
        run: ./bin/gargamelle-verify
